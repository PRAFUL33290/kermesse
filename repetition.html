<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Répétitions enfants · Scène des Talents</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><script src="data.js"></script><script>const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\./g,'').trim();const uniqueNames=names=>{const seen=new Map();names.forEach(name=>{const display=canonical(name);const key=norm(display);if(!seen.has(key))seen.set(key,display);});return [...seen.values()]};const categoryKids=name=>uniqueNames(FREE_CATEGORIES.find(c=>c.name===name).scenes.flatMap(s=>s.who));const schoolKids=name=>{const p=SCHOOL_PROJECTS.find(p=>p.name===name);const names=[];if(p.kids)names.push(...p.kids);if(p.languages)p.languages.forEach(l=>names.push(...l.kids));return uniqueNames(names);};const schedule=[{day:'Lundi',scenes:[{source:"Quinzaine de l'égalité",type:'school'},{source:'Oh Mama Tetema + Freestyle',type:'school'}]},{day:'Mardi',scenes:[{source:'Danse',type:'category'},{source:'Chant',type:'category'},{source:'Carnaval de Deborah',type:'school'}]},{day:'Jeudi',scenes:[{source:'Théâtre',type:'category'},{source:'Capoeira',type:'school'}]},{day:'Vendredi',scenes:[{source:'Jonglage ballon de foot',type:'category'},{source:'Roller',type:'category'}]}];</script></div></body></html>
